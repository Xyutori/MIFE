user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
	                  '$status $body_bytes_sent "$http_referer" '
	                  '"$http_user_agent"';

	access_log  /var/log/nginx/access.log  main;
	sendfile    on;
	keepalive_timeout  65;
	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# Cache diam untuk aset berversi (SvelteKit immutable); HTML tidak di-cache.
	map $request_uri $cache_control {
		default                      "public, max-age=0, must-revalidate";
		~*\.(js|css|woff2?|ttf|png|jpg|jpeg|webp|svg|ico)$  "public, max-age=31536000, immutable";
	}

	upstream server_api {
		server server:4000 fail_timeout=5s max_fails=3;
		keepalive 32;
	}

	server {
		listen 80;
		server_name _;
		root /usr/share/nginx/html;
		index index.html;

		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;

		# API + auth (Better Auth) diteruskan ke Elysia.
		# Tanpa trailing slash agar /api/* lolos apa adanya.
		location /api/ {
			proxy_pass http://server_api;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Connection "";
			proxy_read_timeout 60s;
		}

		# SPA fallback: file nyata dulu, sisanya index.html.
		location / {
			expires $cache_control;
			add_header Cache-Control $cache_control always;
			try_files $uri $uri/ /index.html;
		}
	}
}
