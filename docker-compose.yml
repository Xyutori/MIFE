name: MIFE

# Konfigurasi deploy ada di .env.production masing-masing app
# (apps/server/.env.production, apps/web/.env.production).
# Tidak ada lagi .env di root — compose hanya memakai default di bawah
# atau override via environment saat menjalankan compose.

services:
  postgres:
    image: postgres:16-alpine
    # Kredensial dari apps/server/.env.production (POSTGRES_*).
    # Samakan password-nya dengan password di DATABASE_URL file yang sama.
    env_file:
      - path: apps/server/.env.production
        required: true
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d symi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  minio:
    image: chainguard/minio:latest
    entrypoint: ["/usr/bin/minio"]
    command: server /data --console-address ":9001"
    # Kredensial dari apps/server/.env.production (MINIO_ROOT_*).
    # Samakan dengan S3_ACCESS_KEY/S3_SECRET_KEY file yang sama.
    env_file:
      - path: apps/server/.env.production
        required: true
    volumes:
      - minio-data:/data
    # Tanpa healthcheck: image chainguard minimal tanpa curl/wget.
    # Server tahan terhadap MinIO yang belum siap (restart policy meng-cover).
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      secrets:
        - web_env
        - server_env
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: apps/server/.env.production
        required: true
    # Tanpa environment override: .env.production sudah berisi nilai prod
    # (DATABASE_URL @postgres, S3 @minio). Dev lokal pakai apps/server/.env.
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:4000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "80"
    ports:
      - "8080:80" # cek lokal tanpa tunnel; hapus bila tidak perlu
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./deploy/cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - /home/xyutori/.cloudflared/123f6502-b7ba-40d6-9588-b89a400cb0ef.json:/etc/cloudflared/creds.json:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

# BuildKit secrets: HANYA tersedia saat install/build, tidak masuk image.
# Build memakai .env.production (nilai prod); dev lokal pakai .env biasa.
secrets:
  web_env:
    file: apps/web/.env.production
  server_env:
    file: apps/server/.env.production

volumes:
  pgdata:
  minio-data:
