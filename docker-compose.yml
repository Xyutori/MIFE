name: MIFE

# Variabel ${...} dibaca dari .env di root repo (lihat .env.example).
# Jangan commit .env — berisi secret.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: symi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d symi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  minio:
    image: chainguard/minio:latest
    entrypoint: ["/usr/bin/minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?isi MINIO_ROOT_PASSWORD di .env}
    volumes:
      - minio-data:/data
    # Tanpa healthcheck: image chainguard minimal tanpa curl/wget.
    # Server tahan terhadap MinIO yang belum siap (restart policy meng-cover).
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      secrets:
        - web_env
        - server_env
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      # Aplikasi HANYA membaca DATABASE_URL (single source of truth).
      # POSTGRES_PASSWORD hanya untuk inisialisasi volume postgres pertama
      # kali — nilainya harus cocok dengan password di DATABASE_URL.
      DATABASE_URL: ${DATABASE_URL:?isi DATABASE_URL di .env}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?isi MINIO_ROOT_PASSWORD di .env}
      PORT: "4000"
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:4000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_SERVER_URL: https://mife.feryn.xyz
      secrets:
        - web_env
    init: true
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "80"
    ports:
      - "8080:80" # cek lokal tanpa tunnel; hapus bila tidak perlu
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./deploy/cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - /home/xyutori/.cloudflared/123f6502-b7ba-40d6-9588-b89a400cb0ef.json:/etc/cloudflared/creds.json:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

# BuildKit secrets: hanya tersedia saat install/build, tidak masuk image.
secrets:
  web_env:
    file: apps/web/.env
  server_env:
    file: apps/server/.env

volumes:
  pgdata:
  minio-data:
